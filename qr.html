<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120003">
<title>QR المنيو — مبهم كافيه</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090001;color:#f7ead4}
body{font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center}
.poster{width:min(100vw,864px);min-height:100vh;padding:54px 24px 48px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,rgba(100,0,10,.42),transparent 46%),linear-gradient(90deg,rgba(65,0,8,.65),transparent 30%,rgba(75,0,8,.35) 60%,transparent 90%),linear-gradient(180deg,#260006,#100002 55%,#220005)}
.poster:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;background:repeating-linear-gradient(94deg,transparent 0 75px,rgba(255,255,255,.035) 79px,transparent 84px)}
.content{position:relative;z-index:1}
.logo{width:min(460px,82vw);max-height:180px;object-fit:contain;display:block;margin:0 auto 18px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.65))}
.sub{font-size:20px;margin-bottom:28px}
.qr-frame{width:min(560px,88vw);aspect-ratio:1;margin:0 auto;padding:22px;background:#f7ead4;border:2px solid #d6b35c;border-radius:24px;box-shadow:0 0 0 7px rgba(43,0,5,.8),0 14px 45px rgba(0,0,0,.55);display:grid;place-items:center}
#qrcode{line-height:0;width:100%;height:100%;display:grid;place-items:center}
#qrcode img,#qrcode canvas{width:100%!important;height:100%!important;display:block;image-rendering:pixelated}
.rule{height:1px;width:min(680px,86vw);margin:32px auto 18px;background:linear-gradient(90deg,transparent,#d6b35c,transparent)}
.diamond{color:#d6b35c;font-size:20px;margin-top:-30px;background:#220005;width:max-content;padding:0 14px;margin-left:auto;margin-right:auto}
h1{font-size:32px;margin:22px 0 8px}.en{font-size:16px;letter-spacing:6px;color:#d6b35c}
.back{display:inline-block;margin-top:30px;padding:11px 28px;border:1px solid #d6b35c;border-radius:24px;color:#f7ead4;text-decoration:none;background:rgba(30,0,4,.55)}
.note{font-family:Arial,sans-serif;font-size:12px;color:#cdbd9e;margin-top:16px}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<main class="poster">
<div class="content">
<img class="logo" src="mbhm-logo.webp?v=1" alt="مبهم — قهوة مختصة">
<div class="sub">قهوة مختصة</div>
<div class="qr-frame"><div id="qrcode" aria-label="QR Code يفتح منيو مبهم"></div></div>
<div class="rule"></div><div class="diamond">◆</div>
<h1>امسح الرمز لعرض المنيو</h1>
<div class="en">SCAN FOR MENU</div>
<a class="back" href="index.html">العودة للموقع</a>
<div class="note">الرمز مرتبط مباشرة بموقع مبهم والمنيو الإلكتروني</div>
</div>
</main>
<script>
new QRCode(document.getElementById("qrcode"),{text:"https://fahad1417f.github.io/",width:520,height:520,colorDark:"#170003",colorLight:"#f7ead4",correctLevel:QRCode.CorrectLevel.H});
</script>
</body>
</html>
